name: NIDO CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend (Spring Boot & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nido_test
          POSTGRES_USER: nido_test
          POSTGRES_PASSWORD: nido_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests
        working-directory: backend
        env:
          POSTGRES_DB: nido_test
          POSTGRES_USER: nido_test
          POSTGRES_PASSWORD: nido_test_password
        run: |
          chmod +x mvnw
          ./mvnw clean test

  frontend-check:
    name: Frontend (Angular 21 & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Production Build
        working-directory: frontend
        run: npm run build

      - name: Run Unit Tests
        working-directory: frontend
        run: npm run test:ci
