services:
  db:
    image: postgres:17
    container_name: nido-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nido}
      POSTGRES_USER: ${POSTGRES_USER:-nido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nido}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-nido}\" -d \"$${POSTGRES_DB:-nido}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nido-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nido}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nido}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nido}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nido-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
